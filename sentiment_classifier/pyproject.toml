[tool.poetry]
name = "sentiment-classifier"
version = "0.1.0"
description = ""
authors = ["Manuel Gil <manuelgilsitio@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
spacy = "^3.7.4"
spacy-transformers = "^1.3.4"
ipython = "^8.23.0"
jupyter = "^1.0.0"
pandas = "^2.2.1"
scikit-learn = "^1.4.1.post1"
mlflow = "^2.11.3"

[tool.poetry.scripts]
create_binary_dataset = "sentiment_classifier.data.training_dataset:create_training_and_testing_dataset"
train = "sentiment_classifier.model.trainer:train_spacy_model"
predict = "sentiment_classifier.model.scoring:predict"
score = "sentiment_classifier.model.deployment:online_inference"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
