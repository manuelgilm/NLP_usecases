[tool.poetry]
name = "financial-news-sentiment"
version = "0.1.0"
description = ""
authors = ["Manuel Gil <manuelgilsitio@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
transformers = {extras = ["torch"], version = "^4.40.0"}
pandas = "^2.2.2"
scikit-learn = "^1.4.2"
ipython = "^8.23.0"
jupyter = "^1.0.0"
mlflow = "^2.12.1"
torchvision = "^0.18.1"

[tool.poetry.scripts]
read_data = 'financial_news_sentiment.data.retrieval:read_data'
predict = 'financial_news_sentiment.model.predict:predict'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
